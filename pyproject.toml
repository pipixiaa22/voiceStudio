[project]
name = "script"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.0.0",
    "flask-sqlalchemy>=3.1.0",
    "flask-cors>=4.0.0",
    "requests>=2.31.0",
    "deep-translator>=1.11.0",
    "moviepy>=2.0.0",
]

[project.scripts]
subtitle-web = "server.app:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = [".", "server"]
testpaths = ["tests", "server/tests"]
